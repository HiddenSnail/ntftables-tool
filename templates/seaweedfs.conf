# SeaweedFS 模板（全组件合一）
# 如需按组件分别控制白名单，请使用以下子模板：
#   seaweedfs-master  — 9333 (master)
#   seaweedfs-volume  — 9080-9180 (volume)
#   seaweedfs-filer   — 8888 (filer)
#
# 典型场景：
#   sudo ./nftables-tool.sh allow seaweedfs-master 0.0.0.0/0   # 全开放
#   sudo ./nftables-tool.sh allow seaweedfs-filer 10.0.0.0/24  # 仅集群
NAME="SeaweedFS"
DESCRIPTION="SeaweedFS distributed file system (全组件: master/volume/filer)"
PORTS=("9333" "9080-9180" "8888")
PROTOCOL="tcp"
